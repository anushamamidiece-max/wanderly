# Builds the app and deploys it to GitHub Pages on every push to main.
# One-time setup in your repo: Settings → Pages → Source: "GitHub Actions".
#
# The repository MUST be named "wanderly" (the --base flag below matches it).
# Optional: add VITE_GEMINI_API_KEY etc. under Settings → Secrets and
# variables → Actions → New repository secret, and they'll be baked into
# the build.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (with /wanderly/ base path for Pages)
        run: npm run build -- --base=/wanderly/
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
          VITE_UNSPLASH_ACCESS_KEY: ${{ secrets.VITE_UNSPLASH_ACCESS_KEY }}

      # GitHub Pages has no SPA rewrites; serving index.html as the 404
      # page lets deep links like /wanderly/destination/kyoto load the app.
      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
